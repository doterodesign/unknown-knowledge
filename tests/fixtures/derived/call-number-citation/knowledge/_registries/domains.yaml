# Derived-layer fixture (UCS-1158) — the domains registry.
#
# Two top-level classes with children, deliberately: a browse tree over one
# domain would not prove that nodes stable-sort against each other, and the
# domain-first and form-first axes only visibly differ when more than one
# domain shares a form.
schema-version: 2
store: knowledge
registry: domains
hierarchical: true
values:
  - value: design-system
    gloss: The shared design system.
    warrant: K-000001, K-000002 and proposal:knowledge:21321321-3213-4213-8213-213213213213 all document design-system material.
    decision: D-000001
    minted: "2026-08-16"
  - value: design-system/components
    gloss: The component library and the rules its parts obey.
    warrant: K-000001 states component sizing quirks, proposal:knowledge:21321321-3213-4213-8213-213213213213 the render budget, K-000002 the contrast rule at export.
    decision: D-000001
    minted: "2026-08-16"
  - value: engineering
    gloss: Building and shipping the product's frontend.
    warrant: K-000003 and proposal:knowledge:17117117-1171-4171-8171-171171171171 both document engineering material.
    decision: D-000001
