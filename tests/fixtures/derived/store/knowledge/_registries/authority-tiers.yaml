# Derived-layer fixture (UCS-1158) — the citation authority tiers.
#
# The tier records HOW FAR a cited source can be trusted: without it a
# regulator's text and a hallway conversation read identically. That is why a
# citation with no tier is its own finding.
#
# Governed as VOCABULARY only, at this ticket. Nothing in the engine compares
# two tiers or resolves a conflict between citations yet — automatic conflict
# ranking arrives with the resolution pipeline (UCS-1152). Recording the tier
# now is what makes that possible: a tier nobody wrote down cannot be ranked
# retroactively.
#
# Every warrant below names the leaves that ACTUALLY carry the value. The engine
# does not verify warrant prose — it is the steward's written reason, checked by
# review — so a copied warrant that names the wrong leaf is exactly the drift
# that survives every automated gate.
schema-version: 2
store: knowledge
registry: authority-tiers
values:
  - value: vendor-doc
    gloss: The vendor's own published documentation.
    warrant: >-
      K-000001 cites the Component Kit API reference, and proposal:knowledge:17117117-1171-4171-8171-171171171171 the triage
      tool's own guide.
    decision: D-000001
    minted: "2026-08-16"
  - value: interview
    gloss: A conversation with someone who knows, written down.
    warrant: proposal:knowledge:21321321-3213-4213-8213-213213213213 rests on a platform-team interview.
    decision: D-000001
    minted: "2026-08-16"
  - value: regulator
    gloss: A regulator's own published text — the highest tier.
    warrant: >-
      K-000002 cites the WCAG handbook, K-000003 a perf-budget matrix, and
      K-000004 the ISO 12646 color-token standard.
    decision: D-000001
    minted: "2026-08-16"
# No `internal` tier. It was minted here by an earlier copy of this fixture whose
# warrant named L-000133 as citing an internal design memo — but L-000133
# cites the WCAG handbook and carries `regulator`, so no leaf in this store
# has ever used `internal`. A registry value with no material to fill it is
# precisely what literary warrant forbids (UCS-1148), so it is removed rather
# than re-justified: the honest fix for an unwarranted value is to drop it.
