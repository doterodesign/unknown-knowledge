# Derived-layer fixture (UCS-1158) — the domains registry.
#
# Two top-level classes with children, deliberately: a browse tree over one
# domain would not prove that nodes stable-sort against each other, and the
# domain-first and form-first axes only visibly differ when more than one
# domain shares a form.
schema-version: 1
store: knowledge
registry: domains
hierarchical: true
values:
  - value: design-system
    gloss: The shared design system.
    warrant: L-000117, L-000133 and L-000213 all document design-system material.
    decision: D-401
    minted: "2026-08-16"
  - value: design-system/components
    gloss: The component library and the rules its parts obey.
    warrant: L-000117 states component sizing quirks, L-000213 the render budget, L-000133 the contrast rule at export.
    decision: D-401
    minted: "2026-08-16"
  - value: engineering
    gloss: Building and shipping the product's frontend.
    warrant: L-000162 and L-000171 both document engineering material.
    decision: D-401
    minted: "2026-08-16"
  - value: engineering/frontend
    gloss: Shipping the web client, and the checks that gate a release.
    warrant: L-000162 states the bundle-size budget, L-000171 the regression triage.
    decision: D-401
    minted: "2026-08-16"
  - value: brand
    gloss: The brand system and its precision rules.
    warrant: L-000228 states the color token table the design system depends on.
    decision: D-401
    minted: "2026-08-16"
  - value: brand/identity
    gloss: Brand color, type, and the tokens that carry them.
    warrant: L-000228 states the brand color token table.
    decision: D-401
    minted: "2026-08-16"
