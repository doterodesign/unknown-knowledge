# Phoenix fixture (UCS-1154) — the domains registry ACROSS a phoenix event.
#
# It carries the old class and the new ones at once, which is the honest state
# of a store mid-event: the successors must be minted before the mapping may
# move anything to them (the engine refuses an unminted destination), and the
# predecessor stays listed until the event that retires it has landed.
# Suppressing `design-system/components` here would refuse the very leaves the
# event is about to move off it.
#
# All three leaves sit under `design-system/components`, which is what makes
# P-001 a genuine SPLIT rather than a rename: one predecessor, two successors,
# and only the mapping's rows can say which leaf goes to which.
schema-version: 2
store: knowledge
registry: domains
hierarchical: true
values:
  - value: design-system
    gloss: The shared design system.
    warrant: K-000001, K-000002 and K-000003 all document design-system material.
    decision: D-000001
    minted: "2026-08-16"
  - value: design-system/components
    gloss: Reusable UI components and the material that ships with them.
    warrant: >-
      K-000001 states a focus-ring spec, K-000003 the render budget, and
      K-000002 the empty-state guidance that shipped alongside a component —
      the drift D-000002 splits apart.
    decision: D-000001
    minted: "2026-08-16"
  - value: design-system/primitives
    gloss: The single-control building blocks — how one component is built.
    warrant: K-000001 (focus-ring spec) and K-000003 (primitive render budget).
    decision: D-000002
    minted: "2026-08-17"
  - value: design-system/patterns
    gloss: Composition guidance — how several primitives are arranged together.
    warrant: K-000002 (empty-state pattern guidance), split out of components.
    decision: D-000002
    minted: "2026-08-17"
