# Query-decomposition fixture (UCS-1152) — the NOUN vocabulary the query's noun
# axis joins through.
#
# K-101 "Sport" is the concept the prototype's "add a new sport" ask reaches by
# its noun, while `add-sport` reaches the same leaf by its verb. Both joins
# firing on one leaf is what makes the additive leaf scoring observable: the
# recipe leaf scores operation + concept + term, and no single signal explains
# its rank.
#
# K-103 "Bet status" is DELIBERATELY vocabulary no leaf in this store writes as
# a term. A leaf still reaches it, by declaring the concept id — the structural
# join from UCS-1151, exercised here through the new leaf-first scoring.
schema-version: 1
entries:
  - id: K-101
    term: Sport
    class: 100-sportsbook
    summary: A sport the book offers markets on.
    aliases: [sport type]
    source-of-truth: [src/registry/sports.ts]
    status: active
  - id: K-103
    term: Bet status
    class: 100-sportsbook
    summary: The lifecycle state a placed bet is in.
    aliases: [bet]
    source-of-truth: [src/settlement/rounding.ts]
    status: active
