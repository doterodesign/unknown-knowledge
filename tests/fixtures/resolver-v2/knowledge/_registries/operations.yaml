# Query-decomposition fixture (UCS-1152) — the operations registry, the VERB
# vocabulary the query's verb axis joins through.
#
# `add-token` is the canonical case: the ask "add a new token (stencil) for the
# eu eaa launch" names no concept, and the leaf that answers it is reached
# because it DECLARED this operation. That is the join this registry exists to
# make possible.
#
# `retire-token` is declared only by 600.4, which declares add-token too — so a
# leaf carrying MORE THAN ONE operation exists, and the published `operations`
# array has an order that must not depend on how it was authored.
#
# `archive-theme` is SUPPRESSED: a value a steward explicitly refused. It must
# never join an ask, and it must not be treated as unheard-of either.
schema-version: 1
store: knowledge
registry: operations
values:
  - value: add-token
    gloss: Enter a new token into the design-system registry.
    warrant: 600.1 documents the token registration recipe.
    decision: D-201
    minted: "2026-07-07"
  - value: export-theme
    gloss: Export a theme once its tokens resolve.
    warrant: 610.1 documents banker's rounding at theme export; 600.2 and 600.3
      state the jurisdiction constraints exporting answers to.
    decision: D-201
    minted: "2026-07-07"
  - value: retire-token
    gloss: Withdraw a token from the registry.
    warrant: 600.4's checklist covers the withdrawal pass as well as the launch
      one, and declares this operation alongside add-token.
    decision: D-201
    minted: "2026-07-07"
  - value: archive-theme
    gloss: Archive a published theme.
    warrant: 600.2 states the fallback basis for archived themes, so the term was
      recorded; the stewards refused it as an operation in favour of export-theme.
    decision: D-201
    minted: "2026-07-07"
    status: suppressed
