# Query-decomposition fixture (UCS-1152) — the operations registry, the VERB
# vocabulary the query's verb axis joins through.
#
# `add-sport` is the prototype session's central case: the ask "add a new sport
# (lacrosse) for the new jersey launch" names no concept, and the leaf that
# answers it is reached because it DECLARED this operation. That is the join
# this registry exists to make possible.
#
# `retire-sport` is minted but declared by no leaf — a verb the store governs
# and has no knowledge for. It must resolve as an operation and contribute no
# leaves, which is a different fact from an unknown verb.
#
# `void-bet` is SUPPRESSED: a value a steward explicitly refused. It must never
# join an ask, and it must not be treated as unheard-of either.
schema-version: 1
store: knowledge
registry: operations
values:
  - value: add-sport
    gloss: Enter a new sport into the sportsbook registry.
    warrant: 600.1 documents the sport registration recipe.
    decision: D-201
    minted: "2026-07-07"
  - value: settle-bet
    gloss: Settle a placed bet once its event resolves.
    warrant: 600.1 documents settlement rounding.
    decision: D-201
    minted: "2026-07-07"
  - value: retire-sport
    gloss: Withdraw a sport from the registry.
    warrant: 600.1 documents the inverse of registration.
    decision: D-201
    minted: "2026-07-07"
  - value: void-bet
    gloss: Void a placed bet before settlement.
    warrant: 600.1 recorded the term, and the stewards refused it.
    decision: D-201
    minted: "2026-07-07"
    status: suppressed
