# Structural-validator fixture (UCS-1148) — the citation authority tiers.
#
# Which tiers a project recognizes is the project's own to mint: a tier is a
# governed value, never an engine-shipped enum.
schema-version: 1
store: knowledge
registry: authority-tiers
values:
  # This scenario's 600.1 plants `authority: hearsay`, so neither tier below can
  # cite it as warrant. Both are warranted by the leaves that DO carry a valid
  # tier, which is what makes `hearsay` fail as an unminted value against a
  # populated registry rather than against an empty one.
  - value: primary
    gloss: The issuing body's own published text.
    warrant: 600.2, 600.3 and 600.4 cite the operating manual, the issuer's own text.
    decision: D-201
    minted: "2026-07-07"
  - value: secondary
    gloss: Commentary on a primary source.
    warrant: The gadget trade summaries cited across the widgets division.
    decision: D-201
    minted: "2026-07-07"
