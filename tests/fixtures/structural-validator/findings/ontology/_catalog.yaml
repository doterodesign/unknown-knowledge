# Structural-validator fixture (KK-05) — one specimen per finding class.
# BAD violates the id grammar; O-000004 names a file that does not exist;
# O-000002 is deliberately NOT declared (orphan lives in the class file).
schema-version: 2
store: ontology
entries:
  - id: BAD
    title: Malformed id
    file: classes/300-widgets.yaml
  - id: O-000001
    title: Widget
    file: classes/300-widgets.yaml
  - id: O-000003
    title: Out-of-range widget
    file: classes/300-widgets.yaml
  - id: O-000004
    title: Points at a missing file
    file: classes/330-missing.yaml
