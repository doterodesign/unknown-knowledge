# Structural-validator fixture (UCS-1147) — the store is sharded by ACCESSION
# ID PREFIX: knowledge/L-00/, knowledge/L-01/. The prefix is the first two
# digits of the accession's numeric part, a fanout device and nothing more.
#
# Position carries no meaning. A row names its leaf by accession and locates it
# by `file`, and those are two independent facts: moving a leaf between shard
# directories changes the second, invalidates no citation, and produces no
# diagnostic. K-000001 and K-000003 cite each other ACROSS shards to make the
# point — neither citation could be written differently if they shared one.
schema-version: 2
store: knowledge
entries:
  - id: K-000001
    title: Widget registry rules
    file: L-00/L-000101-widget-registry.md
  - id: K-000002
    title: Widget retirement rules
    file: L-00/L-000102-widget-retirement.md
  - id: K-000003
    title: Widget audit schedule
    file: L-01/L-010501-widget-audit.md
