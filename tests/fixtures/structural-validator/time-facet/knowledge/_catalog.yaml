# Time facet fixture (UCS-1150) — every verdict class the facet can produce,
# pinned against an injected today of 2026-08-16.
#
#   K-000001  stable,   365 days old  -> trusted  (exactly at the limit)
#   K-000002  stable,   366 days old  -> stale    (one day past it)
#   K-000003  volatile,  90 days old  -> trusted  (exactly at the limit)
#   K-000004  volatile,  91 days old  -> stale    (one day past it)
#   K-000005  static,   ~16 years old -> trusted  (static never stales)
#   K-000006  static,    no date      -> trusted, and validates clean
#   K-000007  no volatility           -> exempt, and validates clean
#
# The two pairs are the boundary goldens: each limit is pinned from BOTH sides,
# because "more than a year old" and "a year or more old" differ by exactly one
# day and nothing in the phrase says which.
schema-version: 2
store: knowledge
entries:
  - id: K-000001
    title: Stable knowledge verified exactly at the limit
    file: freshness/301.1-stable-at-the-limit.md
  - id: K-000002
    title: Stable knowledge verified one day past the limit
    file: freshness/302.1-stable-past-the-limit.md
  - id: K-000003
    title: Volatile knowledge verified exactly at the limit
    file: freshness/303.1-volatile-at-the-limit.md
  - id: K-000004
    title: Volatile knowledge verified one day past the limit
    file: freshness/304.1-volatile-past-the-limit.md
  - id: K-000005
    title: Static knowledge verified long ago
    file: freshness/305.1-static-ancient.md
  - id: K-000006
    title: Static knowledge carrying no verified date
    file: freshness/306.1-static-undated.md
  - id: K-000007
    title: Knowledge declaring no volatility class
    file: freshness/307.1-exempt-no-volatility.md
