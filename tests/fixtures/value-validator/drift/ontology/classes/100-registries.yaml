    enumerates:
      - kind: test-lines
        source: src/icons.txt
        values: [grid, list, star]
  - id: O-000002
    term: Color token
    class: 100-registries
    summary: A base color token.
    source-of-truth: [src/color-tokens.txt]
    status: active
    enumerates:
      - kind: test-lines
        source: src/color-tokens.txt
        values: [srgb, p3]
  - id: O-000003
    term: Legacy breakpoint
    class: 100-registries
    summary: Retired breakpoint registry kept for audits.
    source-of-truth: [src/breakpoints.txt]
    status: deprecated
    enumerates:
      - kind: test-lines
        source: src/breakpoints.txt
        values: [mobile]
