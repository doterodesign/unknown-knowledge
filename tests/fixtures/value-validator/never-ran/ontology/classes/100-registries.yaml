# KK-07 check-never-ran fixture: O-000001 points at a file that does not exist;
# O-000002's source carries an out-of-envelope sentinel. Both are hard errors on
# active concepts — a check that never ran is a blocking defect (PRD §5) —
# and BOTH are reported in one run.
schema-version: 2
entries:
  - id: O-000001
    term: Icon
    class: 100-registries
    summary: An icon the product's icon set ships.
    source-of-truth: [src/missing.txt]
    status: active
    enumerates:
      - kind: test-lines
        source: src/missing.txt
        values: [grid]
  - id: O-000002
    term: Color token
    class: 100-registries
    summary: A base color token.
    source-of-truth: [src/envelope.txt]
    status: active
    enumerates:
      - kind: test-lines
        source: src/envelope.txt
        values: [srgb]
