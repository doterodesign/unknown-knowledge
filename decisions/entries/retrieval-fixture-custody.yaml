entries:
  - id: "proposal:decision:768020f6-acd8-4577-9d55-724d93365dc2"
    title: "Retrieval fixtures use independently reviewed sources and pinned trial custody"
    category: "process"
    status: "proposed"
    date: "2026-09-20"
    deciders: ["P10 evaluator (proposal author; acceptance pending)"]
    context: >
      The six organization scenarios require distinct topology, lifecycle and
      scope behavior rather than renamed copies. A prepared installation is not a
      completed reader experiment; synthetic approval cannot be attributed to real
      people. Original-runtime compatibility also differs from canonical-runtime
      semantics.
    decision: >
      Freeze source judgments before observing rankings and keep exact candidate
      expectations separate from relevance. Independently review source metadata,
      record attribution, subject warrants and representation; retain
      source-specific absent assignments, proposals, historical status and scoped
      relationships. Use eight isolated installations for six organizations,
      including disconnected holding namespaces and a Decision-only policy
      installation. Support governance records are outside the source-answer
      universe and still consume exposure budgets. Prepare the actual original
      resolver plus documented recovery from its pinned Git export with
      replacement objects disabled. Record dependency and Node provenance
      separately. The historical host verifies declared bytes and charges all
      delivered metadata, repeats, failures and outputs; it is neither an OS
      sandbox nor a canonical-runtime adapter. Preserve three-repeat, paired,
      equal-budget experiment requirements. The 72-task total is a recommendation,
      not a user mandate.
      On 2026-09-21, a fresh independent custodian could not establish a
      qualifying unused pool in the inspected evaluator, repository, main-artifact
      and temporary custody metadata. The historical Gate G archive matches its
      completed and exposure-disclosed receipt; six planned sealed slots remain
      empty. This is a bounded search finding, not proof of global absence.
      Main agrees the custodian's six-case source-first proposal, SHA256
      a251ddcc5cf46a08a1a60427f59f28e78d89ba6267e28f1b1df8593b6dc9983c:
      exactly one new task per existing organization over unchanged public source
      truth, with a conditional aggregate target of three answerable transfer and
      three scoped-negative cases. Source support and substantive novelty take
      priority over balance; report a shortage rather than inventing facts.
      Privately check overlap with public and historical intents, independently
      review source entailment and novelty before sealing, and expose only blinded
      coverage, hashes and provenance to implementation owners. Main will assign
      a fresh reviewer. These are new task-level holdouts, not unseen sources,
      new-organization generalization or pristine project-wide blindness. Keep
      historical repair separate. This agreement authorizes curation only, no
      reader or product execution. Full method and custody pointer are recorded
      in acceptance/retrieval/HELDOUT-CURATION.md.
      Independent source and novelty review subsequently accepted three cases
      and required three material judgment/bundle corrections. The custodian
      preserved all prompts, twelve source files and previously accepted case
      blocks, and focused independent re-review accepted all six in private v3.
      The acceptance manifest SHA256 is
      10e2e594cf054e2b4154e1e915a94d5f5ba61844a3fbef3986589494ac8a71ec.
      Main authorizes sealing that accepted package while preserving original
      and revised review evidence. This does not authorize reader execution or
      establish runtime fidelity, qualified qrels, unseen-corpus generalization
      or retrieval quality; implementation owners receive only blinded receipts.
      Sealing subsequently completed with accepted v3 as the sole active source
      package. The blinded source-seal receipt SHA256 is
      033a6ad0c7461edf36621d0c81f6a956b90692007793ee3ef2adf70efe752fa0.
      Original inputs and independent reviews remain provenance, while the
      unsubmitted intermediate v2 is excluded from the seal. Main verified the
      opaque archive hash without opening hidden cases. This is source-case
      custody only; runtime projection, qualified qrels and trial release remain
      separate prerequisites, with zero passed trial cells claimed.
      Growth interpretation amendment, 2026-09-21: r3 section 12 requires new
      relevant and distractor evidence with replay and re-adjudication; it does
      not require runtime lifecycle publication for each synthetic addition.
      Construct exactly sixteen reviewed source records in copied initial-condition
      fixtures using the existing native allocator and static/governance checks,
      with zero new support Decisions solely to authorize evaluator setup.
      Preserve original record/source/assignment/history/registry bytes and prior
      ledger/catalog rows. This is explicitly synthetic construction, not a
      published operation, self-authorization or first-authorizer capability.
      Finalize independent actual-record fidelity, per-task grades and evidence
      bundles before ranking/query execution. Main reviews construction inputs
      and releases construction and replay separately.
      Public agent comparison amendment, 2026-09-21: use one registered
      162-session campaign: eighteen public tasks in original/current arms,
      three repeats each, plus six public sentinel tasks in three additional
      current arms with three repeats. The first six engineering sessions are
      a checkpoint within that schedule; clean conduct/accounting permits the
      remaining 156 under the same contract, without a new pilot design.
      Use fresh agents with configured model/reasoning defaults and retain actual
      exposed metadata. Immutable backend details unavailable from the host
      remain disclosed limitations. Keep runtime 08066b5 original and 79c3efc
      current, source-equivalent installations and equal development-1 budgets.
      Main verified sixteen snapshots, 4346 file hashes and ninety record pairs;
      source bytes and Knowledge bodies remain exact. Only question-native ID
      tokens differ for holding-01 and holding-05; evaluator correspondence and
      judgments never enter reader installations. Prepare real Git indexes in
      isolated clients because the installed survey protocol requires them.
      Reuse the delivery host and native-v2 decoder, adding only actual installed
      query, validation, survey and finding transport and registered arm rules.
      Counters are shared across each session's disconnected installations.
      Set the per-return ceiling to the existing 262144-byte total rather than
      the old demonstration-only 16384-byte ceiling; cumulative limits do not
      increase. Independent ordered transcript accounting must include actual
      framing, repeats and source passages appearing in records or tool outputs.
      Failed, missing or truncated delivery cannot establish a complete trial.
      The sealed preparation is public-agent-campaign-v1, freeze SHA256
      98e09e56f302a0b67db7ba38b19450bafb27e1be4d74a104080029ffbc0deaca.
      This records preparation choices, not reader results or held-out release.
      P2 subsequently accepted the bounded outer-accounting review, with semantic
      annotations and protocol conduct still requiring independent assessment.
      Main verified all six zero-operation client states and released the first
      six sessions separately. Release SHA256 is
      973d3d15d313b795ca749c0bb9b1968181446bf4e957971fa15f276813b9a354;
      independent review SHA256 is
      0cf73d1197eac6e7f518cf897e37817b48eb69c385eff645a103a4764416d9e2.
      The release is not a trial outcome or authorization for held-out transfer.
      The six attempts subsequently completed with one adequate answer, zero
      clean-conduct passes and five complete accounting audits. Main verified
      all 216 result files. Four sessions misused the host installation argument,
      three had path typos and four omitted a required output-limit setting;
      these categories overlap. No current Subject query ran. The large registry
      response was fully delivered despite one reader's truncation claim.
      Current-r2 source-byte accounting remains unknown for transformed factual
      wording; preserve that original report. The remaining 156 are held under
      the agreed checkpoint condition. Exact results and hashes are recorded in
      acceptance/retrieval/PUBLIC-AGENT-CHECKPOINT.md.
      Main and P2 agree preparation only of prospective v2 instructions for the
      156 unrun slots: exact copyable host prefix and aliases, valid output-limit
      syntax and native guide pointers, applied consistently without task/answer
      hints. Retain original six as v1, with version strata and valid matched
      pairs explicit; never replace them or pool as an unchanged 162-session run.
      Separately reviewed paraphrases may bind exact delivered UTF8 spans/hash
      and original source hashes/offsets plus rationale/reviewer provenance.
      Multiple source supports charge one delivered span once; every repeated
      occurrence charges again. Preserve shared nonoverlap/UTF8 checks, unchanged
      caps and exact-source behavior. Missing review or uncovered factual wording
      stays incomplete/null; a paraphrase flag alone cannot establish coverage.
      This authorizes concrete preparation and controls, not revised readers,
      retroactive v1 acceptance, automatic semantic proof or any product change.
      Main subsequently verified all 483 corrected v2 amendment files,
      reconstructed all 156 prompts from original frozen inputs and checked
      forty-eight native guide pointers. P2 accepted the concrete source-span
      examples and minimal refusal-control fix: unexpected-success assertions
      must remain outside the handler that catches the tested function's refusal.
      All fourteen corrected controls passed; original failed receipts remain.
      Main released only the remaining 156 reader slots after measurement ended
      on 2026-09-21, preserving the original six, tasks, sources, host, caps and
      scoring. Report 51 v2 paired comparisons and 54 extra-variant slots;
      nine engineering-01 extras lack a v2 full-current baseline and cannot
      borrow the original v1 attempts. The twelve worked exposure occurrences
      totaling 345 bytes do not establish full transformed-source accounting;
      unreviewed coverage remains null. Release and exact hashes are recorded
      in acceptance/retrieval/PUBLIC-AGENT-CHECKPOINT.md. No quality result,
      repair closure or separately blocked held-out metadata transfer follows.
      An evaluator-generated Python cache caused slot 12 predispatch verification
      to refuse. Preserve the cache and failed check separately, restore only the
      original directory membership, verify all 32 packet files and nine inputs,
      and repeat verification on the untouched zero-operation client. No reader
      reset, changed frozen file or skipped verifier is authorized by this
      instrumentation correction; subsequent imports suppress bytecode writes.
      The first v2 engineering-02 pair received independent source/conduct
      adjudication: the original arm answered adequately after fresh selected
      gates and source reads; the current arm stopped at a nonexact query-budget
      host refusal before executing its plan. Preserve its answerable-task
      abstention, missing rankings and both arms' transport deviations.
      A separate manual supplement subsequently classified all 933 string values
      in the current arm's registry and lookup outputs: 221 source-derived
      occurrences total 10,345 delivered UTF8 bytes, including repeated history
      and lookup exposures; 712 structural/editorial values are explicitly
      excluded. Main read all nineteen meaning rationales and independently
      verified file/source hashes, complete value-path coverage, exact byte
      spans, nonoverlap and arithmetic. The source total remains a subset of
      tool bytes. Whole-session accounting additionally requires the retained
      coverage judgments for every other output. The original exact-only audit
      and initial v1 null total remain unchanged; this additive human review
      does not turn the stopped answer or transport conduct into a pass.
      Supplement manifest SHA256 is
      5449291d9d6f9a201761a012066ef41a03d974a865abaae0015e145528e3ac70.
      Exact output/source matches may reuse those reviewed meanings, charging
      each actual occurrence; source changes or unmatched outputs need review.
      A second independent supplement completes cultural-research-01 current-r1
      registry and three lookup outputs: all 785 string values are classified,
      with 227 charged occurrences totaling 9,904 bytes and 558 explicit
      exclusions. Main read fifteen meaning rationales and both source documents,
      and verified nine retained files, seven inputs, exact value paths/spans,
      source bindings, nonoverlap and sums. Repeated lookup input labels also
      count as delivered source naming. Whole-session accounting combines this
      subtotal with P10's separately retained complete zero-source judgments for
      other outputs. Preserve original null audits and the answerable abstention;
      accounting completion is not successful conduct. Manifest SHA256 is
      3c253a092a49923bab1afdceb1bb003d673d45d9e4ec4f08767797a1adee2a7c.
      Stop-rule adjudication is command-specific: cultural-research-01 original-r1
      received a host-only refusal for an optional source line-window reread,
      after both complete source files had already been delivered. No engine
      command ran for that refusal. The frozen instruction stops on engine
      exit 2; it does not establish a violation from the subsequent required
      finding log alone. Retain the refused read and its cost, with an additive
      correction to that stop judgment only. This does not waive cap stops or
      certify the whole session. Separately, complete source access does not
      satisfy omitted required answer details: cultural-research-02 original-r2
      remains partial under its frozen answer rubric.
      Prospective budget-onboarding correction: the first 24 v2 slots include
      twelve current-arm refusals before native query execution. Main and P2
      independently inspected engineering-02 and cultural-research-01 current-r1
      prompts, delivered guidance, authored plans and host receipts. Every
      supplied capacity is at most the frozen capacity, but the host requires
      exact object equality even in structural and binding-inspection modes.
      The prompt prohibits enlargement without disclosing this stricter rule
      or the available query-budgets.json path. This is a host/onboarding gap,
      not demonstrated native query failure or solely agent noncompliance with
      a disclosed exact policy. Pause new dispatch while live readers finish;
      preserve all completed attempts. Prepare a neutral v3 instruction for
      unrun slots only: read that root policy through the existing host, copy
      its complete object unchanged into each query/branch in every mode, and
      explain that smaller limits also refuse. The host continues supplying
      frozen validation/execution admission files. Count the policy read normally.
      Keep host, tasks, sources, runtime, capacities, scoring, stop rules and
      autonomous query formulation unchanged. Report version strata and actual
      valid pairs; no replacements, automatic plan filling or relaxed admission.
      Preparation does not release readers or guarantee later successful conduct.
      Main diagnosis SHA256 is
      c0ec6a1495206e4958e34c11c1b8da174170a5dabded471506d5cf1b66db684c.
      Main subsequently verified all 253 amendment files and reconstructed every
      proposed prompt by removing only the identical neutral addition. The
      terminal boundary preserves six v1 and thirty-three v2 attempts, zero live
      readers and 123 unrun slots. Main releases only original orders 40 through
      162 under v3, preserving the already prepared slot 40 client. Report three
      v1, sixteen v2 and thirty-four prospective v3 same-version pairs; exclude
      one mixed-version pair. Only 33 of 54 additional variant slots have a v3
      full-current baseline. Eligibility is not observed ranking availability.
      Amendment manifest SHA256 is
      a4e9cd6f12ad23051e6c81076932ed9c9598dba35b908139b3a48f92e468223e;
      main release SHA256 is
      83596489d189bfeb96c67c8f818ba1fe551f2c6834d553f2bc942c6d6c5860b0.
      No new pilot, replacement, added slot or held-out transfer is authorized.
      Observed-delivery adjudication, 2026-09-21: public manufacturing-01
      current-r1 has a genuinely truncated registry response but an intact
      query response and source-supported answer. The existing budget contract
      permits accounting for exactly retained visible content without inferring
      complete inspection. P2 classified five pending blocks; main verified
      23 artifacts, 34 inputs, 301 source spans, 679 source-support occurrences
      and complete byte partitions, and read twenty subject meanings and both
      original sources. Additive observed exposure is 17,391 source bytes,
      240,291 tool bytes, fourteen inspected records and three full/selected
      records, within the frozen caps. Exclude 154 previously charged bytes
      that are opaque binding keys or editorial rules; preserve those earlier
      reviews. Count only 80,107 observed registry bytes, never the 87,089
      emitted host bytes. Unknown omitted content, original nulls, actual
      truncation and the unsupported final query-truncation claim remain.
      This supplements accounting without a replacement trial pass, new rubric,
      requery or blanket conduct claim. Supplement manifest SHA256 is
      f388086ddab8f90c2443a97b6d917d1505d35962dc67c0a8a772dd2d5d853101;
      main acceptance SHA256 is
      7d8e1305c0df436df28a33f15fab5a1053346ef1811e8786a3523a53fe907384.
      Subsequent explicit user authorization permits removal of the internal
      communication blocker and review of evaluation reports, following an
      explanation of public-report transfer to integration and necessary setup
      metadata transfer to the held-out custodian. Hidden questions and expected
      answers remain separate from implementation tasks. Record authorization
      independently of this proposed Decision's publication status; no result
      acceptance, model training, release or customer migration follows.
      The completed public campaign retains all 162 attempts. Main matched 524
      final artifact hashes and independently recomputed 32 eligible v3 pairs:
      source adequacy is 30 original versus 18 current, and registered evidence
      completion is 21 versus 16. Preserve these adverse results and versioned
      exclusions rather than replacing trials or interpreting narrow ranking
      gains as overall success. Distinguish host limits, protocol usability and
      native defects before choosing a correction; changing limits or claiming
      acceptance from deterministic tests alone would hide the observed issue.
      Causal triage, held-out evidence and final hard-gate review remain open.
      acceptance/retrieval/PUBLIC-CAMPAIGN-RESULTS.md records the evidence,
      qualifications and remaining work. Historical authorization notes remain.
      Final held-out preparation retains the accepted six cases, two arms and
      three repeats without new curation, public reruns or capacity changes.
      Compare original 08066b5f527b9d7d9705a3367bc26dcf080271ad against current
      52a62703c77ee159703a1018d21a0abe356912cb after the reviewed query-authoring
      and stop-wording clarifications. Later evidence-only commits do not move
      that export: freezing a concrete runtime avoids invalidating preparation
      whenever reports change. Reuse accepted source judgments only on explicit
      byte equality, independently finish support/projection review, and bind
      dependencies, installations and host inputs before main's separate reader
      release. Preparation and blinded status are recorded in
      acceptance/retrieval/HELDOUT-CURATION.md. The public critical-category
      addendum separately finds incomplete event adjudication; unavailable counts
      remain null rather than being inferred as zero from source adequacy or
      strict-witness passes. This preserves hard gates without inventing a new
      experiment or retroactively clearing historical failures.
      Independent final readiness subsequently accepts all six cases, eight
      support pairs, qualified passage projections, 36 exact prompts/initial
      states and accounting inputs with zero unresolved objections. Main matches
      the ten blinded readiness bindings, using prior independent runtime and
      host checks without another full byte audit or hidden-content access.
      Release exactly the prepared 36 sessions under unchanged pins, model
      request, date, schedule and capacities, at most two readers concurrently.
      Preserve every attempt, refusal and uncertainty without replacement or
      hidden retry. Actual dispatch equality, exposed model metadata, ordered
      transcript/source accounting and independent critical judgments remain
      execution obligations rather than invented preparation results. The release
      SHA256 is 38b9dd8dd10a5e7cd0a91e7e33cad34d3c915d314dd268bef00a2f4bb9331fb7;
      acceptance/retrieval/HELDOUT-CURATION.md links readiness and release.
      Main and the owners select this concrete runtime under the authorized user
      goal; do not attribute the exact pin or gate interpretation to an explicit
      user choice. No package publication, customer migration, historical regrade
      or completed held-out outcome follows from execution release.
      A concrete dispatch capability gap remains after readiness: the custodian
      has no native reader-spawn tool. Main, P10, Hegel and McClintock agree to
      reuse the existing evaluation-only public_v2_dispatch operator through the
      same native fresh-agent primitive, model request and unchanged 36-slot
      profile. The operator may receive exact prepared prompts and observed
      reader outputs but not expected answers or qrels. Hegel retains truth and
      scoring custody. All operator outward and automatic parent messages are
      blinded; implementation owners never inspect child readers. Reject a
      main-parent mechanical relay because automatic child finals would expose
      hidden answers, and reject new sidebar tasks or an alternate CLI harness.
      Independent review accepts the exact allowlisted handoff with zero
      objections; main records and releases the role amendment before dispatch.
      Actual serialized prompt equality remains null where encrypted/omitted
      persistence prevents verification, rather than treating a prepared hash
      as proof. The amendment SHA256 is
      a57eb377c61a1a39617c3caac3b9f22b8f216acf796bbce5beb999178ce45872;
      acceptance/retrieval/HELDOUT-CURATION.md records the evidence and limits.
    consequences: >
      This rejects implementation-derived oracles, source-answer injection, live
      federation, hidden identity crosswalks and substituting fixed plans for
      fresh agents. Fixtures and reviewed curation choices are preparation, not
      publication approval or demonstrated quality. Existing detailed records:
      acceptance/retrieval/development-v2/ADJUDICATION.md,
      metadata-review/adjudication.md, curation-review/record-decisions.json,
      curation-review/README.md and MATERIALIZATION.md; the latter paths are under
      development-v2. Custody limits: acceptance/retrieval/TRIAL-HOST.md and
      DEVELOPMENT-BUDGETS.md; implementation: materialize.js,
      materialize-development.js and trial-host.js in that directory. Frozen
      fixture files remain unchanged.
      PR7 Linux CI exposed six deterministic fixture failures because the default
      shallow checkout omitted the pinned original commit. The engine-test job
      now fetches complete Git history before running the unchanged baseline
      export, digest and replacement-object checks. Fetching history is test
      preparation; it publishes no archive ref, changes no evaluated pin and
      releases no new reader experiment. Changing the baseline or skipping its
      checks would invalidate compatibility evidence. The original failed run
      and focused shallow/full-history reproduction remain separately bound in
      docs/pr-delivery/pr-07-ci-correction.json. Coordinator authorization covers
      this CI setup correction, not acceptance of this proposed Decision.
    relates-to: {"concepts": [], "leaves": [], "decisions": ["D-000007", "D-000014"]}
