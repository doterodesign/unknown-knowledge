entries:
  - id: proposal:decision:77f89b29-f6a5-454b-b12d-b045a3364c2f
    title: Migration publication proves finite typed preservation against a fixed historical runtime
    category: architecture
    status: proposed
    date: "2026-09-19"
    deciders: [codex]
    context: >
      Exact mechanical rewriting does not prove retrieval or generated-view
      preservation. The historical resolver can exit zero for an unhealthy store,
      identity changes can reorder tied results, and general text replacement
      could conceal changed provenance or prose. Arbitrary legacy installation
      formats have no complete semantic contract yet.
    decision: >
      The first publication-v2 profile uses the immutable 08066b5 historical
      distribution and actual current engine. Require healthy actual loaders and
      structural/value checks, a complete finite vocabulary/path/control recipe,
      actual Markdown and text adapters, and three regenerated ordinary artifacts.
      Preserve original per-side outputs; use temporary occurrence correspondence
      only at closed typed identity positions. Corroborate mixed context segments,
      declared relations, call numbers, generated index/tree structures and each
      actual renderer. Allow only typed identity/display changes and the fixed
      historical-to-canonical citation instruction. Preserve all other fields and
      ordering. Privately resupply migration choices on every final call and match
      the unchanged actual mechanical input digest; never retain a crosswalk.
    consequences: >
      This is finite representative preservation, not every possible query.
      Markdown has three native sections; txt has one native section containing
      the same required passages. No text boundaries are invented. Empty rules
      and three exact generated source paths have explicit preserved roles;
      nonempty rules, historically unvalidated logs, unknown operational roles,
      Subject authority, other required adapters and tie-order changes refuse.
      Explicit case/inventory/generated capacities do not bound native generator
      heap allocations before measurement. Historical generated bytes and failed
      experiments remain unchanged. Evidence is c19bf29, e161e3b and 98295b6,
      actual root/nested fixtures and negative controls, documented in
      docs/agents/ucs-1240-prepared-migration.md and
      docs/agents/ucs-1240-final-migration.md. Broader migration remains open;
      canonical readers gain no legacy-ID aliases or lookup fallback.
      Follow-on scope agreed with P1 against r3 section 9 on 2026-09-20 uses
      publication-v3 and migration-operational-history-v1 for actual retained
      Phoenix/finding/gap/miss validation. Both fixed historical and current
      validateStoreFile owners must accept each original document; loadStores
      health is insufficient for logs. Reuse exact mechanical source-span
      rewriting, including reviewed operational prose, rather than introduce
      another replacement grammar. Retain separate original evidence and compare
      actual edition accounting privately; preserve edition equals one plus
      retained move events, carry-forward behavior, reasons, counts and dates.
      Prior v2 evidence remains historical and cannot satisfy the new runtime
      and policy. The recipe and operational evidence share the inventory cap.
      This is a finite required-history slice, not complete activated-consumer
      inventory; four document adapters are not mandated in every profile.
      Strict ordering, unknown-rule/extension refusal and private correspondence
      remain unchanged. Implementation: migration-operational-history.js;
      evidence: prepared-migration-semantics.test.js and the actual retained
      migration-publication-vertical.test.js. Main authorization to continue
      this scope is distinct from this still-proposed record's approval.
      Follow-on optional-store scope authorized on 2026-09-21 and implemented
      from c7b055a uses publication-v4, recipe-v2 and explicit source-profile
      evidence. Corroborate actual directory kind and healthy loader metadata,
      equal before/candidate presence and authored record counts, including
      proposals, with at least one payload overall. Preserve the complete private
      identity bijection and exact whole-tree proof. Missing stores and empty
      present stores are distinct; malformed, non-directory and all-empty profiles
      refuse. Actual no-hit and native document controls plus detached empty
      Knowledge views remain required, without inventing Decision retrieval or
      writing a Knowledge directory. Reuse the fixed recipe implementation while
      preserving the original v1 export's refusal behavior. Source profile,
      recipe and history share the inventory capacity; empty serialized views
      still consume generated capacity. Nonempty rules, activated-consumer
      completeness and other source grammars remain explicit limitations in
      docs/agents/ucs-1240-migration-source-profiles.md. Actual acceptance is in
      migration-optional-stores.test.js and migration-publication-vertical.test.js;
      no retained aliases, identity mapping or production approval is introduced.
      Main authorized the connected installation-cutover implementation from
      dd94d25 on 2026-09-21 after reviewing the source-bound consumer design.
      Inventory the complete captured tree and documented local activation forms;
      use independently reviewed exact role judgments through the existing
      trusted orchestration boundary, not a second approval engine. Engine
      coverage and capture equality cannot prove arbitrary program semantics.
      Extend the private exact byte plan to installed runtime, suppression,
      rule, template and invocation changes, retaining the original finite
      profile as a separately identified capability. Unknown required active
      consumers refuse until understood or actually deactivated under review.
      Add bounded read-only observed activation separately from candidate ref
      publication; no arbitrary client code execution or future-state guarantee.
      Concrete closed inputs, evidence and supported forms are specified in
      docs/agents/ucs-1240-installation-cutover.md. Runtime replacement is pinned
      to the actual supported historical distribution and current trusted
      distribution; seed provenance is unchanged. Retire old allocation ranges
      under explicit review, never translate endpoints into canonical identity
      ranges. Suppression roles distinguish stale-concept ID pairs from literal
      term/path pairs. Preserve private correspondence disposal and exact full
      tree equality. This authorization does not accept or publish this Decision.
      The first concrete installation profile uses the default nested layout
      and unconditional seeded asset set without optional extractor stacks.
      Freeze the 08066b5 manifest-selected vendor asset bytes and replace them
      with the actual trusted current asset set, including protocol, templates,
      hooks and adapter fixtures. This avoids interpreting example identities as
      client record references. Customized vendor assets refuse in this profile;
      other reviewed consumer spans preserve bytes outside exact references.
      Capture those current assets with the migration runtime so detached final
      verification sees the same distribution. Existing seed provenance remains
      historical; it is never treated as a present-day integrity assertion.
      Observed activation admits the current process environment and one
      repository-relative literal hook directory. The existing trusted role
      review explicitly declares that there are no required external consumers;
      the engine cannot infer that absence. Read the effective hooksPath, HEAD,
      published ref, index entries, complete live file tree and PATH-selected
      Node executable without executing discovered code. Require exact candidate
      bytes and modes, the captured trusted Node, no unreviewed files, and an
      executable reviewed pre-commit launcher. Environment overrides or dynamic
      external wiring refuse. Reobserve around fresh retained/final verification;
      agreement is bounded evidence of local state, never an atomic activation
      or a guarantee about a later invocation. The verifier writes no client
      files, index or config; publication continues to name a candidate only.
      Implementation is migration-installation.js, migration-consumer-proof.js
      and migration-activation.js, integrated with the retained/fresh migration
      gate and existing review/publication path. The supported vertical and
      refusal evidence are installation-cutover.test.js,
      installation-cutover-refusals.test.js, installation-assets.test.js and
      installation-publication-vertical.test.js. Seventeen scoped tests and
      75 regression tests passed on Node 24.19.0; exact receipts and profile
      limits are in docs/agents/ucs-1240-installation-cutover.md. Publication
      never changes client worktree/index/config; observation is a separate
      result and unknown external consumers remain an independent-review block.
      Independent review of the initial installation implementation identified
      an omitted Linux LD_AUDIT environment override before activation's first
      Git spawn. The integration owner authorized the narrow correction: reject
      every nonempty LD_ and DYLD_ variable, alongside the existing GIT_ family
      and explicit Node/location variables. The finite observing profile does
      not need selected loader overrides, so a complete family refusal avoids
      another incomplete list without adding environment interpretation. This
      Linux gap is source-confirmed, not DSO-reproduced. The existing actual
      retained/publication fixture verifies LD_AUDIT and DYLD_FRAMEWORK_PATH
      refusals with zero child-spawn attempts; both spawn APIs are intercepted
      before host-safe sentinel injection, including on the failing RED path.
      Positive fixture setup selects the same restricted environment. Original
      frozen evidence remains historical; the focused follow-up has separate
      RED and GREEN receipts in the installation-cutover guide.
    relates-to: { concepts: [], leaves: [], decisions: [D-000003, D-000005, D-000008, D-000012, D-000014] }
