schema-version: 2
entries:
  - id: "proposal:decision:1e9f760f-6a23-42ef-a76d-f828bdd007e5"
    title: "Governed repair reports retain failures and separate evidence from improvement"
    category: "governance"
    status: "proposed"
    date: "2026-09-20"
    deciders: ["P10 evaluator (proposal author; acceptance pending)"]
    context: >
      The final canonical repair experiment produced improved native
      Knowledge-list metrics but unchanged overall adequacy and combined
      acceptance. The changed condition also added a Decision and bookkeeping, so
      it cannot establish a pure alias effect. Earlier public navigation and
      historical protocol trials have separate failure conditions.
    decision: >
      Retain all 36 canonical attempts and paired transitions, including stops,
      protocol violations, missing accounting and regressions. Seal original
      traces and independent adjudication with hashes; publish only aggregate
      results and custody limitations, with private questions, answers and
      judgments kept separate. Report native delivered rank lists without
      inventing a cross-store ranking. Separate source-grounded adequacy from full
      conduct and cap compliance; post-stop evidence gathering is not acceptable
      conduct. Disclose late coordinator exposure after independent review without
      retroactively claiming perfect blinding. Preserve prior public navigation
      failures and historical S4 trials as their own pinned evidence. Do not
      rerun, regrade or revise frozen artifacts as documentation maintenance.
      Scope clarification, 2026-09-21: the registered maximum of six repair
      cases is not a requirement to invent a repair for each organization.
      Retain the actual existing canvas-output alias target and its locale and
      canvas-locale controls on their original fixture. Preserve before commit
      7039cc025e9a57aca18edc96539fdde25850df48 and candidate commit
      d96bfb54aa25b74cda8e7c621c43338604e6cfb2, their source and allowed deltas,
      prior failed acceptance and pending repair state. The minimal prospective
      comparison has three cases by two states by three repetitions, eighteen
      slots; reuse up to nine before traces only if all frozen inputs and
      scoring/conduct contracts match exactly. This is a preparation agreement,
      not certified trace reuse or execution. No new repair or writer is needed.
      Held-out acceptance remains separate and required; the public 162-session
      corpus comparison is unchanged. This avoids expanding one documented
      repair claim into unrelated taxonomy changes or cross-corpus comparisons.
      Public evidence audit, 2026-09-21: read the original target pair with its
      append-only correction. After's first broad query has no ranked concepts
      but already contains O-000001 in decomposition and K-000001 in leaves.
      It is not zero resolution; withdraw the alleged missing zero-resolution
      health check as a current finding. Required catalog reads remain legitimate.
      The actual unnecessary exact-alias requery and original failed navigation
      criterion remain; do not award the hypothetical correct path a pass.
      The literal canvas-locale probe retains empty ranks/leaves and Locale
      decomposition but gains an Export-format near-miss after repair, so its
      entire response is not unchanged. No semantic source-separation pass follows
      from this fixed probe. Main separately accepts prospective locale and
      two-part canvas-output-and-locale questions as reader constructs: the latter
      requires two independently sourced answers without inventing a combined
      feature, and is not equivalent to the original partial-wording probe.
      The exact historical target question, runtime 4faab47, candidate and source
      bytes remain distinct from current-runtime evidence. Both original target
      observations may be considered as historical r1 only after explicit exact
      condition matching, retaining their failed outcomes; confirmed reuse is
      still zero. Preparation does not release another reader. Main and owners
      must identify the genuinely missing acceptance proof before adding trials
      of historical protocol weaknesses already studied in later experiments.
      The public correction SHA256 is
      13b3c34ce52a5b3716ff0e3abbae62bd3713db6cb9befcce64b0c2158bbb7ade;
      the new P9 evidence-audit SHA256 is
      104f191cd7185f6e04cd00cc6d1da0694d3ac4bc1733e3a4da1fa585152280b6.
      Original reports, traces, pending findings and separate held-out obligations
      remain intact. See acceptance/retrieval/DECISIONS-AND-EVIDENCE.md.
      Evidence-efficiency disposition: main, P9 and P10 agree not to release
      sixteen to eighteen additional historical-runtime readers just to fill
      the proposed matrix. Governed publication, fixed positive/negative replays,
      the original fresh pair and a separate historical held-out study already
      exist; failed navigation is adverse proof, not an absent trial. More old
      observations cannot erase it or establish current-protocol behavior.
      The independently reviewed literal canvas-locale outputs and captured
      source bytes now support their bounded no-cross-attribution interpretation:
      Locale remains a partial binding, Export format is only an after near-miss,
      and neither response asserts a joint feature or answer. The handbook
      expressly separates Locale from canvas output. This closes the deferred
      source/scope reading of those two machine reports, not reader conduct or
      the original repair-success criterion. Main's source adjudication SHA256
      is 8ec0d13a816f3d15446a962a1dc427d612737abda064e29d84a37ce2b3d2a7d5;
      P10 independently read the same responses and agreed the bounded conclusion.
      Its additive state-binding clarification has SHA256
      c017caf2187147933ca1028f040db73b874729c588d904c2830ee9ff890b1d4b:
      the cited product record is from the after state and intentionally differs
      from before; the formats, locales and handbook source bytes are unchanged.
      Retain both preparation packets with no new dispatch or reuse credit.
      Later corrected-protocol evidence must be mapped to its own applicable
      goal requirements without treating it as a pure alias effect. Original
      findings remain proposed and repair pending; remaining hard gates and
      separate held-out acceptance are not waived.
      Corrected-condition applicability disposition, 2026-09-21: main, P9 and
      P10 accept the composite positive-route, nearby-negative and fresh-agent
      evidence for the explicitly corrected protocol condition. Historical exact
      governed publication and fixed replays retain their separate provenance;
      the adjudicated literal mixed probe supplies bounded source separation.
      Later v3 t02 at runtime 5bad18d actually answers the same natural-language
      target after its initial full-question query, required metadata navigation,
      trusted O-000001 preflight and original 39-byte formats source, without an
      unnecessary requery. Main verified raw lines 65, 104 and 109, exact artifact
      hashes and the relevant native implementation/protocol differences through
      8c54353. The native route remains applicable; this is not fresh execution
      at current HEAD. No further old-runtime reader is needed for that narrow
      obligation. Preserve the original failed navigation, v3 overall failure,
      fixture differences and custody limits. Distinct evidence does not form a
      matched alias-only experiment or establish population reliability, typed
      queries, API/MCP behavior or held-out quality. Proposed findings and pending
      repair state remain; no governed bookkeeping or overall completion occurs.
      Main acceptance SHA256 is
      308a456f58434cdd6acedc5c14e6350992a4484727aef5744d12a0447fd851a1;
      P10 independent acceptance SHA256 is
      e2f0ce1450321418fb320a69d077c697a74b2b8557b159b683fe080726cb7e87.
      Final target disposition adds the original independent sealed reviewer's
      focused mapping of retained private obligations, calls, evidence and the
      existing regression/event to the registered canvas-alias-replacement-01
      criterion. Metadata-only v1 was unestablished; additive v2 establishes no
      breach of this narrow target or nearby controls and no target-specific
      critical event before or after. Preserve the regression's own adequacy
      failure, broader historical one-before/zero-after critical counts and the
      absence of a corrected-condition rerun of that private attempt. Combining
      this mapping with the already accepted publication, positive/negative
      replays and actual t02 reader supports one of one claimed narrow targets
      under the explicitly corrected protocol condition. Main accepts that
      target disposition; an aggregate score or metadata absence alone would
      not justify it. Main acceptance SHA256 is
      53e23a8fc47c2b7da7596dffab908c89b6a31936551e9e6bf880e53a16cd680d.
      The old governed work row binds older exact conditions and is not flipped
      to completed; the original navigation/v3 failures remain. This closes the
      narrow claimed target, not all historical acceptance conditions, a causal
      alias-only claim, wider quality or the separate new held-out obligation.
    consequences: >
      This rejects selective successful-run reporting and declaring improvement
      from hits or closed logs. At runtime
      4faab47f0141e73c3c818b5035854dc9348f7198, adequacy was 14/18 in each arm and
      combined acceptance 3/18 in each; there was one paired improvement and one
      regression. A bounded completed repair study does not close spec r3 §12 or
      establish broader held-out quality. Public
      FINAL-CANONICAL-GATE-G-RESULTS-v1.md and its aggregate/seal receipt are
      linked through acceptance/retrieval/DECISIONS-AND-EVIDENCE.md; full sealed
      private evidence remains outside the repository.
    relates-to: {"concepts": [], "leaves": [], "decisions": ["D-000011"]}
