# D-000001 adopts them without choosing a new vocabulary. Only `artifact` carries fixture material today; the other
# two are minted because the vocabulary is the store model itself.
schema-version: 2
store: knowledge
registry: anchor
values:
  - value: artifact
    gloss: The repo decides. The claim is checkable against code, config, or schema.
    warrant: 100.1's claim reads back to src/registry/export-formats.ts — the repo settles it.
    decision: D-000001
    minted: "2026-07-08"
  - value: world
    gloss: An outside authority decides — a regulator, a vendor, a standard.
    warrant: Kit decision D-000003 splits the Knowledge store on this anchor; kept so a world-anchored leaf has somewhere to sit.
    decision: D-000001
    minted: "2026-07-08"
  - value: team
    gloss: The team decided. The claim is true because it was chosen, not discovered.
    warrant: Kit decision D-000003 splits the Decisions store on this anchor; D-000001 itself is a team-anchored fact.
    decision: D-000001
    minted: "2026-07-08"
