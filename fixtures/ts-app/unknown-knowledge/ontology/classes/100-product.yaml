# Acceptance-fixture ontology (KK-15) — planted cases are deliberate; the
# expected finding per concept is tabulated in ../../../FIXTURE.md. Descriptors
# are always SCHEMA-VALID: drift lives in the values, never in the shape.
schema-version: 2
entries:
  # -- clean extractions (A2), adversarial-but-extractable formatting --------
  - id: O-000001
    term: Export format
    class: 100-product
    summary: A file format the editor can export artboards to.
    aliases: [export type]
    source-of-truth: [src/registry/export-formats.ts]
    owned-by: editor
    used-by: [O-000002]
    confusable-with: [O-000013]
    rationale: [D-000001]
    status: active
    last-verified: "2026-07-08"
    enumerates:
      - kind: ts-const-array
        source: src/registry/export-formats.ts
        symbol: EXPORT_FORMATS
        values: [png, svg, jpg, webp, pdf]
  - id: O-000003
    term: Release status
    class: 100-product
    summary: Lifecycle state of a design-library release.
    source-of-truth: [src/types/release-status.ts]
    status: active
    last-verified: "2026-07-08"
    enumerates:
      - kind: ts-union
        source: src/types/release-status.ts
        symbol: ReleaseStatus
        values: [draft, in-review, published, deprecated]
  - id: O-000005
    term: Color space
    class: 100-product
    summary: Color spaces the canvas can render in.
    source-of-truth: [src/types/color-space.ts]
    status: active
    last-verified: "2026-07-08"
    enumerates:
      - kind: ts-enum
        source: src/types/color-space.ts
        symbol: ColorSpace
        emit: names
        values: [SRGB, P3, LAB, LCH]
  - id: O-000006
    term: Panel
    class: 100-product
    summary: Dockable workspace panels the editor shell can open.
    source-of-truth: [src/registry/panels.ts]
    status: active
    last-verified: "2026-07-08"
    enumerates:
      - kind: ts-object-keys
        source: src/registry/panels.ts
        symbol: PANELS
        values: [layers-panel, inspector, assets-panel, comments]
  - id: O-000007
    term: Status color
    class: 100-product
    summary: Badge color assigned to each release status (.tsx anchor).
    source-of-truth: [src/components/StatusBadge.tsx]
    used-by: [O-000003]
    status: active
    last-verified: "2026-07-08"
    enumerates:
      - kind: ts-object-keys
        source: src/components/StatusBadge.tsx
        symbol: STATUS_COLORS
        values: [draft, in-review, published, deprecated]
  - id: O-000009
    term: Feature flag
    class: 100-product
    summary: Runtime feature switches read from app config.
    source-of-truth: [config/features.json]
    status: active
    last-verified: "2026-07-08"
    enumerates:
      - kind: json-keys
        source: config/features.json
        values: [multiplayer-cursors, version-history, component-variants]
  - id: O-000012
    term: App dependency
    class: 100-product
    summary: Runtime npm dependencies of the app.
    source-of-truth: [package.json]
    status: active
    last-verified: "2026-07-08"
    enumerates:
      - kind: json-map-keys
        source: package.json
        symbol: dependencies
        values: [react, react-dom, zod]
  - id: O-000010
    term: Vertical
    class: 100-product
    summary: Product verticals, one module folder each (folder identity).
    source-of-truth: [src/verticals, src/verticals/editor/index.ts]
    status: active
    last-verified: "2026-07-08"
    enumerates:
      - kind: dir-modules
        source: src/verticals
        values: [editor, prototyping, whiteboard]
  - id: O-000011
    term: Route
    class: 100-product
    summary: App routes, one *.route.ts module each (file-based routing).
    source-of-truth: [src/routes]
    status: active
    last-verified: "2026-07-08"
    enumerates:
      - kind: dir-modules
        source: src/routes
        pattern: "*.route.ts"
        strip: .route.ts
        values: [home, account, files]
  - id: O-000014
    term: Plan tier
    class: 100-product
    summary: Subscription plan tiers (plain .js anchor — TS kinds read JS too).
    source-of-truth: [src/registry/plan-tiers.js]
    status: active
    last-verified: "2026-07-08"
    enumerates:
      - kind: ts-const-array
        source: src/registry/plan-tiers.js
        symbol: PLAN_TIERS
        values: [free, pro, team, enterprise]
  # -- planted bidirectional drift (A3) ---------------------------------------
  - id: O-000002
    term: Blend mode
    class: 100-product
    summary: Layer blend modes. DRIFT — claims 'luminosity', absent from source.
    source-of-truth: [src/registry/blend-modes.ts]
    used-by: [O-000001]
    status: active
    last-verified: "2026-07-08"
    enumerates:
      - kind: ts-const-array
        source: src/registry/blend-modes.ts
        symbol: BLEND_MODES
        values: [normal, multiply, screen, overlay, luminosity]
  - id: O-000004
    term: Asset kind
    class: 100-product
    summary: Library asset kinds. DRIFT — source also has 'video', unclaimed here.
    source-of-truth: [src/types/asset-kind.ts]
    status: active
    last-verified: "2026-07-08"
    enumerates:
      - kind: ts-union
        source: src/types/asset-kind.ts
        symbol: AssetKind
        values: [icon, illustration, photo]
  # -- wrong-pointer signature (A3): every claimed value missing from a real
  #    parseable file; the true home is src/registry/locales.ts ---------------
  - id: O-000008
    term: Locale
    class: 100-product
    summary: Supported locales. WRONG POINTER — descriptor names export-formats.ts.
    source-of-truth: [src/registry/export-formats.ts]
    status: active
    last-verified: "2026-07-08"
    enumerates:
      - kind: ts-const-array
        source: src/registry/export-formats.ts
        symbol: EXPORT_FORMATS
        values: [en-US, es-MX, pt-BR]
  # -- out-of-envelope anchors (§5.1): extractor must HARD-ERROR --------------
  - id: O-000013
    term: Export preset
    class: 100-product
    summary: Export presets across surfaces. UNEXTRACTABLE — spread in the array.
    source-of-truth: [src/registry/export-presets.ts]
    confusable-with: [O-000001]
    status: active
    last-verified: "2026-07-08"
    enumerates:
      - kind: ts-const-array
        source: src/registry/export-presets.ts
        symbol: ALL_PRESETS
        values: [web-2x, print]
  - id: O-000015
    term: Experiment
    class: 100-product
    summary: A/B experiments. UNEXTRACTABLE — computed object key.
    source-of-truth: [src/registry/experiments.ts]
    status: active
    last-verified: "2026-07-08"
    enumerates:
      - kind: ts-object-keys
        source: src/registry/experiments.ts
        symbol: EXPERIMENTS
        values: [quick-insert]
  - id: O-000016
    term: Release status barrel
    class: 100-product
    summary: Barrel re-export of ReleaseStatus. UNEXTRACTABLE — re-export.
    source-of-truth: [src/types/index.ts]
    confusable-with: [O-000003]
    status: active
    last-verified: "2026-07-08"
    enumerates:
      - kind: ts-union
        source: src/types/index.ts
        symbol: ReleaseStatus
        values: [draft, in-review, published, deprecated]
