# One entry per file (kit decision D-000010); schema per payload/schemas/decision-entry.schema.json.
schema-version: 2
entries:
  - id: D-000001
    title: Export-format registry is a const array
    category: architecture
    status: accepted
    date: "2026-07-08"
    deciders: [fixture-team]
    context: >
      The export-format list is read by the export dialog, the renderer, and
      the public API. It needs one reified home an extractor can read lexically.
    decision: >
      Keep EXPORT_FORMATS as an exported const string array in
      src/registry/export-formats.ts; derive the ExportFormat type from it.
    consequences: >
      The list is ts-const-array extractable; adding a format is a one-line
      diff that the value validator can cross-check against the ontology.
    supersedes: []
    superseded-by: []
    relates-to: { concepts: [O-000001], leaves: [K-000001], decisions: [] }
